<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#17302f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Juvia Pass"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" href="/juvia-icon.svg"/>
  <link rel="apple-touch-icon" href="/juvia-icon.svg"/>
  <meta name="description" content="Espace équipe Juvia — scanner fidélité."/>
  <title>Espace Staff — Juvia</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

  <!-- Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lucide icons via CDN -->
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>

  <!-- Canvas Confetti via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--
    Espace Staff layout (rendered by js/app.js):
      Mobile (<1024px)  : single stacked column — intro, scanning
                          square (aspect-ratio 1), manual UUID entry.
      Desktop (≥1024px) : two-column dashboard — scanning square left
                          (≤560px), side card right (manual entry,
                          status, tips / billing form). See the
          "Staff page — desktop responsiveness" block in css/style.css.
  -->
  <div id="app"></div>

  <!-- QR decoding engine.
       Camera access (getUserMedia / WebRTC) is only available in a
       secure context: serve this page over HTTPS (Vercel) or open it
       at http://localhost / http://127.0.0.1 with Live Server.
       js/app.js pre-flights getUserMedia and, if this library fails to
       load, falls back to the raw feed + manual UUID entry. -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"
          onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/dist/html5-qrcode.min.js';s.onload=function(){document.dispatchEvent(new Event('juvia:qrlib'));};document.head.appendChild(s);"></script>

  <!-- App -->
  <script src="js/app.js"></script>
</body>
</html>
